# Perfil `claude`: el chat va a Anthropic en lugar de Groq.
#   $env:ANTHROPIC_API_KEY="..."
#   .\gradlew.bat bootRun --args="--spring.profiles.active=claude"
# El modelo se puede cambiar sin tocar el archivo: $env:ANTHROPIC_MODEL="claude-haiku-5-5"
spring:
  ai:
    model:
      chat: anthropic
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:sin-clave}
      chat:
        options:
          model: ${ANTHROPIC_MODEL:claude-haiku-4-5}
          temperature: 0.0
          # Anthropic exige un máximo de tokens de salida.
          max-tokens: 1024
